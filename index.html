<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orrery — Solar System & Total Solar Eclipse Predictor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ffd24a'/%3E%3Ccircle cx='21' cy='14' r='11' fill='%2305060a'/%3E%3C/svg%3E" />
    <meta name="description" content="A from-first-principles orrery that propagates the planets with Kepler's equation and predicts real total solar eclipses on Earth." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 3D canvas (ground + earth views) and 2D canvas (orrery view) -->
    <canvas id="scene"></canvas>
    <canvas id="orrery"></canvas>

    <!-- Top-left: title + view tabs -->
    <div id="hud" class="panel">
      <h1>ORRERY</h1>
      <p class="sub">Planets propagated live from J2000 Kepler elements · eclipse times via VSOP87 (astronomy-engine)</p>
      <p class="sub hint">drag — rotate · scroll — zoom · click planet — follow · esc — reset</p>
      <div class="row" id="view-tabs">
        <button data-view="orrery" class="tab active">Orrery</button>
        <button data-view="ground" class="tab">Ground POV</button>
        <button data-view="earth" class="tab">Earth path</button>
      </div>
    </div>

    <!-- Top-right: clock + status -->
    <div id="clockbox" class="panel">
      <div id="clock" class="clock">—</div>
      <div id="status" class="status">propagating orbits…</div>
    </div>

    <!-- Right: live computation log (orrery view) -->
    <div id="log" class="panel"></div>

    <!-- Right: eclipse list + observer (orrery / earth views) -->
    <div id="sidebar" class="panel">
      <h2>Total solar eclipses</h2>
      <ul id="eclipse-list" class="list"><li class="muted">Scanning new moons…</li></ul>
      <h2>Observer</h2>
      <div class="obs">
        <select id="obs-preset"></select>
        <div class="row">
          <label>Lat <input type="number" id="obs-lat" step="0.01" value="64.15" /></label>
          <label>Lon <input type="number" id="obs-lon" step="0.01" value="-21.94" /></label>
        </div>
      </div>
    </div>

    <!-- Mobile-only: collapses the eclipse sidebar into a floating button -->
    <button id="panel-handle" aria-label="Toggle eclipse list" aria-expanded="true">
      <span class="ph-icon">◐</span><span id="ph-badge" class="ph-badge">…</span>
    </button>

    <!-- Ground-view controls (top center) -->
    <div id="ground-controls" class="hidden">
      <button id="replay" class="btn">↻ Replay</button>
      <button id="back-system" class="btn">← Back to system</button>
    </div>

    <!-- Bottom: timeline -->
    <div id="timeline" class="panel">
      <div class="row">
        <button id="play" class="btn">▶ Play</button>
        <button id="next-eclipse" class="btn accent">⏭ Find next eclipse</button>
        <label class="speed">Speed
          <input type="range" id="speed" min="0" max="9" step="1" value="6" />
          <span id="speed-label">—</span>
        </label>
      </div>
    </div>

    <!-- Eclipse info card (earth / ground) -->
    <div id="info" class="panel hidden"></div>

    <!-- Planet details popup (orrery view, on planet click) -->
    <div id="planet-card" class="panel hidden"></div>

    <!-- Zoom buttons (orrery + earth views) -->
    <div id="zoom-controls">
      <button id="zoom-in" class="btn" title="Zoom in">+</button>
      <button id="zoom-out" class="btn" title="Zoom out">−</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
